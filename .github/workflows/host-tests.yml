name: Firmware host compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_SHA: 9a6283c260c92acfe0447b0c425668cbb1a64002
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out Firmware
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: firmware
          persist-credentials: false
      - name: Check out reviewed Core baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Janik77/kz-home-core
          ref: ${{ env.CORE_SHA }}
          path: core
          persist-credentials: false
      - name: Verify baseline and host tools
        run: |
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          gcc --version
          cmake --version
          pkg-config --modversion openssl
      - name: Assemble temporary reviewed Core 32 + 33 + 35 snapshot
        working-directory: core
        run: |
          # #35 includes #32; these #33 paths do not overlap #35.
          git fetch --no-tags --depth=1 origin bbb9d7af8647ecc727b9c8201a936f66fa99a91e
          test "$(git rev-parse FETCH_HEAD)" = "bbb9d7af8647ecc727b9c8201a936f66fa99a91e"
          git checkout bbb9d7af8647ecc727b9c8201a936f66fa99a91e -- app/transports/mqtt_client.py tests/test_mqtt_lifecycle.py docs/MQTT_SUBACK_VALIDATION.md
          git diff --cached --check
          echo "TEMPORARY_CORE_TREE=$(git write-tree)"
      - name: Install pinned Core Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/core-venv"
          "$RUNNER_TEMP/core-venv/bin/python" -m pip install --only-binary=:all: -r core/requirements.txt -c firmware/tests/ci-core-constraints.txt
          "$RUNNER_TEMP/core-venv/bin/python" -m pip check
      - name: Run host tests and actual Core compatibility
        working-directory: firmware
        run: |
          "$RUNNER_TEMP/core-venv/bin/python" tests/run_host_tests.py --cc gcc --core-root "$GITHUB_WORKSPACE/core"
